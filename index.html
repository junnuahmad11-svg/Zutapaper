<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuta Paper - Professional Letter Generator</title>
    <!-- Tailwind CSS for modern, responsive, professional styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf.js for robust client-side A4 PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        primaryHover: '#1d4ed8',
                        darkBg: '#0f172a',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Smooth transitions & Astra-like subtle glowing gradients */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for clean professional UI */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-100 selection:text-blue-900">

    <!-- App Container -->
    <div id="app" class="flex-grow flex flex-col">
        <!-- Dynamic views will be rendered here by JavaScript -->
    </div>

    <!-- Confirmation Modal Portal -->
    <div id="modal-container"></div>

    <!-- Footer Credit -->
    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white">
        Zuta Paper • Professional Letter Generator • Made by Zubeir & Thoufiq
    </footer>

    <!-- Application Logic & Complete Source Code -->
    <script>
        // --- State Management & Storage ---
        const STORAGE_KEY = 'zuta_paper_form_data_v1';

        const defaultFormData = {
            recipientName: '',
            recipientDesignation: 'HOD',
            customDesignation: '',
            collegeType: 'cmr',
            institutionName: 'CMRCET',
            addressLines: ['Kandlakoya', 'Medchal'],
            city: 'Hyderabad',
            district: 'Medchal-Malkajgiri',
            state: 'Telangana',
            pincode: '501401',
            studentName: '',
            rollNumber: '',
            courseBranch: 'B.Tech – CSM-F',
            year: '3rd',
            section: '',
            letterDate: new Date().toISOString().split('T')[0],
            absenceType: 'single',
            startDate: new Date().toISOString().split('T')[0],
            endDate: new Date().toISOString().split('T')[0],
            customDatesText: '',
            numberOfDays: 1,
            reasonCategory: 'Personal reasons',
            reasonText: '',
            hasAttendance: 'yes',
            attendancePercentage: '',
            mentorName: '',
            department: '',
            semester: '',
            academicYear: '',
            contactNumber: '',
            email: ''
        };

        let appState = {
            currentScreen: 'splash', // splash, home, form, review, preview, about
            currentStep: 1, // 1 to 6 for form steps
            formData: loadSavedData()
        };

        function loadSavedData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? { ...defaultFormData, ...JSON.parse(saved) } : { ...defaultFormData };
            } catch (e) {
                return { ...defaultFormData };
            }
        }

        function saveFormData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.formData));
            } catch (e) {
                console.error('Could not save to localStorage', e);
            }
        }

        function clearSavedData() {
            try {
                localStorage.removeItem(STORAGE_KEY);
                appState.formData = { ...defaultFormData };
            } catch (e) {
                console.error('Could not clear storage', e);
            }
        }

        // --- College Presets Data ---
        const collegePresets = {
            cmr: {
                displayName: "CMR College",
                institutionName: "CMRCET",
                addressLines: ["Kandlakoya", "Medchal"],
                city: "Hyderabad",
                district: "Medchal-Malkajgiri",
                state: "Telangana",
                pincode: "501401"
            }
        };

        // --- Validation Utility ---
        function validateStep(step) {
            const d = appState.formData;
            switch(step) {
                case 1: // Recipient
                    if (!d.recipientName.trim()) return "Please enter the recipient's full name.";
                    if (d.recipientDesignation === 'Other' && !d.customDesignation.trim()) return "Please enter the recipient's designation.";
                    return null;
                case 2: // College
                    if (d.collegeType === 'other') {
                        if (!d.institutionName.trim()) return "Please enter the college/institution name.";
                        if (!d.addressLines[0].trim()) return "Please enter address line 1.";
                    }
                    return null;
                case 3: // Student
                    if (!d.studentName.trim()) return "Please enter your full name.";
                    if (!d.rollNumber.trim()) return "Please enter your roll number.";
                    if (!d.courseBranch.trim()) return "Please enter your course or branch.";
                    if (!d.year.trim()) return "Please select your year.";
                    return null;
                case 4: // Absence & Reason
                    if (!d.letterDate) return "Please select a letter date.";
                    if (!d.numberOfDays || d.numberOfDays <= 0) return "Please enter the number of days absent.";
                    if (!d.reasonText.trim()) return "Please provide a reason for your absence.";
                    return null;
                case 5: // Attendance
                    if (d.hasAttendance === 'yes') {
                        const att = parseFloat(d.attendancePercentage);
                        if (isNaN(att) || att < 0 || att > 100) return "Please enter a valid attendance percentage between 0 and 100.";
                    }
                    return null;
                default:
                    return null;
            }
        }

        // --- Letter Generator Core Logic ---
        function generateLetterText(d) {
            // Format Date nicely
            const formattedDate = new Date(d.letterDate).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            // Determine Recipient Designation string
            const designation = d.recipientDesignation === 'Other' ? d.customDesignation : d.recipientDesignation;

            // Determine College Address Block
            let addressBlock = '';
            if (d.collegeType === 'cmr') {
                addressBlock = `CMRCET\nKandlakoya\nMedchal, Hyderabad - 501401`;
            } else {
                const lines = [d.institutionName, d.addressLines[0], d.addressLines[1], `${d.city}, ${d.state} - ${d.pincode}`].filter(Boolean);
                addressBlock = lines.join('\n');
            }

            // Date description string
            let dateDesc = '';
            if (d.absenceType === 'single') {
                dateDesc = `on ${new Date(d.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}` ;
            } else if (d.absenceType === 'range') {
                dateDesc = `from ${new Date(d.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} to ${new Date(d.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            } else {
                dateDesc = `on dates: ${d.customDatesText}`;
            }

            // Optional metadata block inside or above letter if needed
            let optionalMeta = [];
            if (d.department) optionalMeta.push(`Department: ${d.department}`);
            if (d.semester) optionalMeta.push(`Semester: ${d.semester}`);
            if (d.academicYear) optionalMeta.push(`Academic Year: ${d.academicYear}`);
            if (d.mentorName) optionalMeta.push(`Mentor: ${d.mentorName}`);

            // Attendance sentence conditional generation
            let attendanceSentence = '';
            if (d.hasAttendance === 'yes' && d.attendancePercentage !== '') {
                const mentorRef = d.mentorName ? `my mentor ${d.mentorName}` : `my mentor`;
                attendanceSentence = `I have informed ${mentorRef} in prior and my attendance percentage is ${d.attendancePercentage}%.`;
            }

            // Build body paragraphs
            let letter = `${formattedDate}\n\n`;
            letter += `${d.recipientName}\n${designation}\n${addressBlock}\n\n`;
            letter += `Respected Sir/Madam,\n\n`;
            letter += `Subject: Request for Leave of Absence\n\n`;
            
            let studentIntro = `I, ${d.studentName}, bearing Roll No. ${d.rollNumber}, from ${d.courseBranch}, ${d.year} year`;
            if (d.section) studentIntro += `, Section ${d.section}`;
            studentIntro += `, was absent ${dateDesc} for ${d.numberOfDays} day(s) due to ${d.reasonText}.`;
            
            letter += `${studentIntro}\n\n`;

            if (attendanceSentence) {
                letter += `${attendanceSentence}\n\n`;
            }

            letter += `I will ensure to follow up on the topics I have missed and will avoid absence in future.\n\n`;
            letter += `Thanking you,\n\n`;
            letter += `Sincerely,\n\n`;
            letter += `Student Name: ${d.studentName}\n`;
            letter += `Roll No: ${d.rollNumber}\n`;
            if (d.courseBranch) letter += `Course/Branch: ${d.courseBranch}\n`;
            if (d.year) letter += `Year: ${d.year} ${d.section ? 'Sec ' + d.section : ''}\n`;
            if (d.contactNumber) letter += `Contact: ${d.contactNumber}\n`;
            if (d.email) letter += `Email: ${d.email}\n`;

            return letter.trim();
        }

        // --- Render Engine ---
        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            switch(appState.currentScreen) {
                case 'splash':
                    app.innerHTML = renderSplashScreen();
                    setTimeout(() => {
                        if (appState.currentScreen === 'splash') {
                            appState.currentScreen = 'home';
                            render();
                        }
                    }, 1500);
                    break;
                case 'home':
                    app.innerHTML = renderHomeScreen();
                    break;
                case 'form':
                    app.innerHTML = renderFormScreen();
                    attachFormListeners();
                    break;
                case 'review':
                    app.innerHTML = renderReviewScreen();
                    break;
                case 'preview':
                    app.innerHTML = renderPreviewScreen();
                    break;
                case 'about':
                    app.innerHTML = renderAboutScreen();
                    break;
            }
        }

        // --- Screen Components ---

        function renderSplashScreen() {
            return `
                <div class="flex-grow flex flex-col items-center justify-center bg-white px-4 fade-in">
                    <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-lg shadow-blue-500/20 mb-6">
                        ZP
                    </div>
                    <h1 class="text-3xl font-bold tracking-tight text-slate-900 mb-2">Zuta Paper</h1>
                    <p class="text-slate-500 font-medium mb-4">Professional Letter Generator</p>
                    <div class="text-xs uppercase tracking-widest text-slate-400 font-semibold">
                        Made by Zubeir & Thoufiq
                    </div>
                </div>
            `;
        }

        function renderHomeScreen() {
            return `
                <div class="flex-grow flex flex-col items-center justify-center px-4 max-w-xl mx-auto text-center fade-in py-12">
                    <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center text-3xl font-bold mb-6 border border-blue-100 shadow-sm">
                        📄
                    </div>
                    <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 mb-3">Zuta Paper</h1>
                    <p class="text-lg font-medium text-blue-600 mb-4">Professional Letter Generator</p>
                    <p class="text-slate-600 mb-8 leading-relaxed">
                        Create a formal college leave or absence letter in a few simple steps. Clean, precise, and instantly ready.
                    </p>
                    <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                        <button onclick="startNewFlow()" class="px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/20 transition-all duration-200 text-base">
                            Create New Letter
                        </button>
                        <button onclick="navigateTo('about')" class="px-8 py-4 bg-white hover:bg-slate-50 text-slate-700 font-semibold rounded-xl border border-slate-200 transition-all duration-200 text-base">
                            About Zuta Paper
                        </button>
                    </div>
                </div>
            `;
        }

        function renderFormScreen() {
            const step = appState.currentStep;
            const totalSteps = 6;
            const progress = (step / totalSteps) * 100;
            const d = appState.formData;

            let stepTitle = "";
            let stepSubtitle = "";

            switch(step) {
                case 1: stepTitle = "Recipient Details"; stepSubtitle = "Who are you sending the letter to?"; break;
                case 2: stepTitle = "College & Address"; stepSubtitle = "Where is the letter heading?"; break;
                case 3: stepTitle = "Student Details"; stepSubtitle = "Your academic identification"; break;
                case 4: stepTitle = "Absence & Reason"; stepSubtitle = "Dates and cause of absence"; break;
                case 5: stepTitle = "Attendance Percentage"; stepSubtitle = "Optional attendance disclosure"; break;
                case 6: stepTitle = "Additional Details"; stepSubtitle = "Optional metadata (mentor, dept, etc.)"; break;
            }

            return `
                <div class="flex-grow flex flex-col max-w-2xl w-full mx-auto px-4 py-8 fade-in">
                    <!-- Top Navigation & Progress -->
                    <div class="mb-8">
                        <div class="flex items-center justify-between mb-4">
                            <button onclick="navigateHomeWithConfirm()" class="text-sm font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-1">
                                ← Exit to Home
                            </button>
                            <span class="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-3 py-1 rounded-full">
                                Step ${step} of ${totalSteps}
                            </span>
                        </div>
                        <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full transition-all duration-300" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <!-- Step Header -->
                    <div class="mb-6">
                        <h2 class="text-2xl font-bold text-slate-900">${stepTitle}</h2>
                        <p class="text-slate-500 text-sm mt-1">${stepSubtitle}</p>
                    </div>

                    <!-- Error Banner Placeholder -->
                    <div id="form-error" class="hidden mb-4 p-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl font-medium"></div>

                    <!-- Step Content Card -->
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-sm mb-6 flex-grow">
                        ${renderStepFields(step, d)}
                    </div>

                    <!-- Form Action Buttons -->
                    <div class="flex items-center justify-between gap-4 pt-2">
                        ${step > 1 ? `
                            <button onclick="prevStep()" class="px-6 py-3 border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold rounded-xl transition-all">
                                Back
                            </button>
                        ` : `<div></div>`}
                        
                        ${step < totalSteps ? `
                            <button onclick="nextStep()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md shadow-blue-600/20 transition-all ml-auto">
                                Continue
                            </button>
                        ` : `
                            <button onclick="finishForm()" class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md shadow-emerald-600/20 transition-all ml-auto">
                                Review Letter →
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function renderStepFields(step, d) {
            switch(step) {
                case 1:
                    return `
                        <div class="space-y-5">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Recipient Full Name *</label>
                                <input type="text" id="recipientName" value="${escapeHTML(d.recipientName)}" placeholder="e.g. Dr. Ramesh Kumar" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none text-slate-800">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Recipient Designation *</label>
                                <select id="recipientDesignation" onchange="updateFormData({recipientDesignation: this.value})" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none text-slate-800 bg-white">
                                    ${['Principal', 'HOD', 'Class Coordinator', 'Faculty/Lecturer', 'Mentor', 'Other'].map(opt => `
                                        <option value="${opt}" ${d.recipientDesignation === opt ? 'selected' : ''}>${opt}</option>
                                    `).join('')}
                                </select>
                            </div>
                            <div id="customDesignationContainer" class="${d.recipientDesignation === 'Other' ? '' : 'hidden'}">
                                <label class="block text-sm font-semibold text-slate-700 mb-2">Custom Designation *</label>
                                <input type="text" id="customDesignation" value="${escapeHTML(d.customDesignation)}" placeholder="e.g. Dean of Academics" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none text-slate-800">
                            </div>
                        </div>
                    `;
                case 2:
                    return `
                        <div class="space-y-5">
                            <div>
                                <label class="block text-sm font-semibold text-slate-700 mb-3">College Preset</label>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <label class="flex items-center gap-3 p-4 border rounded-xl cursor-pointer transition-all ${d.collegeType === 'cmr' ? 'border-blue-600 bg-blue-50/50 ring-1 ring-blue-600' : 'border-slate-200 hover:border-slate-300'}">
                                        <input type="radio" name="collegeType" value="cmr" ${d.collegeType === 'cmr' ? 'checked' : ''} onchange="setCollegeType('cmr')" class="text-blue-600">
                                        <div>
                                            <div class="font-semibold text-slate-900">CMR College</div>
                                            <div class="text-xs text-slate-500">CMRCET, Kandlakoya</div>
                                        </div>
                                    </label>
                                    <label class="flex items-center gap-3 p-4 border rounded-xl cursor-pointer transition-all ${d.collegeType === 'other' ? 'border-blue-600 bg-blue-50/50 ring-1 ring-blue-600' : 'border-slate-200 hover:border-slate-300'}">
                                        <input type="radio" name="collegeType" value="other" ${d.collegeType === 'other' ? 'checked' : ''} onchange="setCollegeType('other')" class="text-blue-600">
                                        <div>
                                            <div class="font-semibold text-slate-900">Other College</div>
                                            <div class="text-xs text-slate-500">Custom Institution</div>
                                        </div>
                                    </label>
                                </div>
                            </div>

                            <div id="otherCollegeFields" class="${d.collegeType === 'other' ? 'space-y-4 pt-2' : 'hidden space-y-4 pt-2'}">
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-2">College/Institution Name *</label>
                                    <input type="text" id="institutionName" value="${escapeHTML(d.institutionName)}" placeholder="e.g. IIT Hyderabad" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-2">Address Line 1 *</label>
                                        <input type="text" id="addressLine1" value="${escapeHTML(d.addressLines[0] || '')}" placeholder="Street / Area" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-2">Address Line 2</label>
                                        <input type="text" id="addressLine2" value="${escapeHTML(d.addressLines[1] || '')}" placeholder="Landmark / Locality" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-2">City</label>
                                        <input type="text" id="city" value="${escapeHTML(d.city)}" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-2">District</label>
                                        <input type="text" id="district" value="${escapeHTML(d.district)}" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-2">State</label>
                                        <input type="text" id="state" value="${escapeHTML(d.state)}" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-semibold text-slate-700 mb-2">PIN Code</label>
                                        <input type="text" id="pincode" value="${escapeHTML(d.pincode)}" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                                    </div>
                                </div>
                            </div>

                            <div class="p-4 bg-slate-50 border border-slate-200 rounded-xl mt-4">
                                <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Live Address Preview</div>
                                <div id="liveAddressPreview" class="text-sm font-medium text-slate-800 whitespace-pre-line">
                                    ${d.collegeType === 'cmr' ? 'CMRCET\nKandlakoya\nMedchal, Hyderabad - 501401' : [d.institutionName, d.addressLines[0], d.addressLines[1], `${d.city}, ${d.state} -${d.pincode}`].filter(Boolean).join('\n')}
                                </div>
                            </div>
                        </div>
                    `;
                case 3:
                    return `
                        <div class="space-y-5">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-2">Full Name *</label>
                                    <input type="text" id="studentName" value="${escapeHTML(d.studentName)}" placeholder="e.g. Rahul Sharma" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-2">Roll Number *</label>
                                    <input type="text" id="rollNumber" value="${escapeHTML(d.rollNumber)}" placeholder="e.g. 22R11A6601" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div class="sm:col-span-2">
                                    <label class="block text-sm font-semibold text-slate-700 mb-2">Course / Branch *</label>
                                    <input type="text" id="courseBranch" value="${escapeHTML(d.courseBranch)}" placeholder="e.g. B.Tech – CSM-F" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-sm font-semibold text-slate-700 mb-2">Year *</label>
                                    <select id="year" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white">
                                        ${['1st', '2nd', '3rd', '4th'].map(y => `<option value="${y}" ${d.year === y ? 'selected' : ''}>${y} Year</option>`).join('')}
                                    </select>
                                </div>
                            </div>
                            <div>

        // --- Interaction & Event Handlers ---

        function navigateTo(screen) {
            appState.currentScreen = screen;
            render();
            window.scrollTo(0, 0);
        }

        function startNewFlow() {
            appState.currentScreen = 'form';
            appState.currentStep = 1;
            render();
            window.scrollTo(0, 0);
        }

        function navigateHome() {
            appState.currentScreen = 'home';
            render();
            window.scrollTo(0, 0);
        }

        function navigateHomeWithConfirm() {
            if (confirm("Are you sure you want to return home? Your progress is saved locally.")) {
                navigateHome();
            }
        }

        function goToFormStep(step) {
            appState.currentScreen = 'form';
            appState.currentStep = step;
            render();
            window.scrollTo(0, 0);
        }

        function setCollegeType(type) {
            appState.formData.collegeType = type;
            saveFormData();
            render();
        }

        function setAbsenceType(type) {
            appState.formData.absenceType = type;
            saveFormData();
            render();
        }

        function setReason(reason) {
            appState.formData.reasonText = reason;
            const textarea = document.getElementById('reasonText');
            if (textarea) textarea.value = reason;
            saveFormData();
        }

        function setAttendanceMode(mode) {
            appState.formData.hasAttendance = mode;
            saveFormData();
            render();
        }

        function setTodayLetterDate() {
            const today = new Date().toISOString().split('T')[0];
            appState.formData.letterDate = today;
            const el = document.getElementById('letterDate');
            if (el) el.value = today;
            saveFormData();
        }

        function updateFormData(obj) {
            appState.formData = { ...appState.formData, ...obj };
            saveFormData();
        }

        function syncFormInputsToState() {
            const d = appState.formData;
            // Capture inputs from current step DOM
            if (document.getElementById('recipientName')) d.recipientName = document.getElementById('recipientName').value;
            if (document.getElementById('recipientDesignation')) d.recipientDesignation = document.getElementById('recipientDesignation').value;
            if (document.getElementById('customDesignation')) d.customDesignation = document.getElementById('customDesignation').value;
            
            if (document.getElementById('institutionName')) d.institutionName = document.getElementById('institutionName').value;
            if (document.getElementById('addressLine1')) d.addressLines[0] = document.getElementById('addressLine1').value;
            if (document.getElementById('addressLine2')) d.addressLines[1] = document.getElementById('addressLine2').value;
            if (document.getElementById('city')) d.city = document.getElementById('city').value;
            if (document.getElementById('district')) d.district = document.getElementById('district').value;
            if (document.getElementById('state')) d.state = document.getElementById('state').value;
            if (document.getElementById('pincode')) d.pincode = document.getElementById('pincode').value;

            if (document.getElementById('studentName')) d.studentName = document.getElementById('studentName').value;
            if (document.getElementById('rollNumber')) d.rollNumber = document.getElementById('rollNumber').value;
            if (document.getElementById('courseBranch')) d.courseBranch = document.getElementById('courseBranch').value;
            if (document.getElementById('year')) d.year = document.getElementById('year').value;
            if (document.getElementById('section')) d.section = document.getElementById('section').value;

            if (document.getElementById('letterDate')) d.letterDate = document.getElementById('letterDate').value;
            if (document.getElementById('numberOfDays')) d.numberOfDays = parseInt(document.getElementById('numberOfDays').value) || 1;
            if (document.getElementById('startDate')) d.startDate = document.getElementById('startDate').value;
            if (document.getElementById('endDate')) d.endDate = document.getElementById('endDate').value;
            if (document.getElementById('customDatesText')) d.customDatesText = document.getElementById('customDatesText').value;
            if (document.getElementById('reasonText')) d.reasonText = document.getElementById('reasonText').value;

            if (document.getElementById('attendancePercentage')) d.attendancePercentage = document.getElementById('attendancePercentage').value;

            if (document.getElementById('mentorName')) d.mentorName = document.getElementById('mentorName').value;
            if (document.getElementById('department')) d.department = document.getElementById('department').value;
            if (document.getElementById('semester')) d.semester = document.getElementById('semester').value;
            if (document.getElementById('academicYear')) d.academicYear = document.getElementById('academicYear').value;
            if (document.getElementById('contactNumber')) d.contactNumber = document.getElementById('contactNumber').value;
            if (document.getElementById('email')) d.email = document.getElementById('email').value;

            saveFormData();
        }

        function nextStep() {
            syncFormInputsToState();
            const error = validateStep(appState.currentStep);
            const errDiv = document.getElementById('form-error');
            if (error) {
                errDiv.textContent = error;
                errDiv.classList.remove('hidden');
                return;
            }
            errDiv.classList.add('hidden');
            if (appState.currentStep < 6) {
                appState.currentStep++;
                render();
                window.scrollTo(0, 0);
            }
        }

        function prevStep() {
            syncFormInputsToState();
            if (appState.currentStep > 1) {
                appState.currentStep--;
                render();
                window.scrollTo(0, 0);
            }
        }

        function finishForm() {
            syncFormInputsToState();
            const error = validateStep(appState.currentStep);
            const errDiv = document.getElementById('form-error');
            if (error) {
                errDiv.textContent = error;
                errDiv.classList.remove('hidden');
                return;
            }
            appState.currentScreen = 'review';
            render();
            window.scrollTo(0, 0);
        }

        function generateFinalLetter() {
            appState.currentScreen = 'preview';
            render();
            window.scrollTo(0, 0);
        }

        function editDetails() {
            appState.currentScreen = 'form';
            appState.currentStep = 1;
            render();
            window.scrollTo(0, 0);
        }

        function confirmStartNew() {
            if (confirm("Are you sure you want to clear the current letter and start over?")) {
                clearSavedData();
                appState.currentScreen = 'home';
                render();
                window.scrollTo(0, 0);
            }
        }

        function copyLetter() {
            const letterText = generateLetterText(appState.formData);
            navigator.clipboard.writeText(letterText).then(() => {
                showToast("Letter copied successfully.");
            }).catch(() => {
                showToast("Failed to copy letter.");
            });
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const opt = {
                margin:       10,
                filename:     `Zuta_Paper_Leave_Letter_${appState.formData.rollNumber || 'Student'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }

        function shareLetter() {
            const letterText = generateLetterText(appState.formData);
            if (navigator.share) {
                navigator.share({
                    title: 'Leave Letter - Zuta Paper',
                    text: letterText
                }).catch(() => {});
            } else {
                copyLetter();
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 3000);
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function attachFormListeners() {
            // Live address update listener for step 2
            const inputs = ['institutionName', 'addressLine1', 'addressLine2', 'city', 'district', 'state', 'pincode'];
            inputs.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', () => {
                        syncFormInputsToState();
                        const d = appState.formData;
                        const previewEl = document.getElementById('liveAddressPreview');
                        if (previewEl) {
                            previewEl.textContent = [d.institutionName, d.addressLines[0], d.addressLines[1], `${d.city}, ${d.state} - ${d.pincode}`].filter(Boolean).join('\n');
                        }
                    });
                }
            });
        }

        // --- Initial Boot ---
        render();
    </script>
