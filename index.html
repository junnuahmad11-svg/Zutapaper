<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuta Paper - Made for CMR College</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf.js for client-side A4 PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #060913;
            color: #f3f4f6;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Ambient Glowing Background Orbs */
        .astra-bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }
        .astra-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.18;
            animation: floatOrb 12s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            top: -150px;
            left: -150px;
        }
        .orb-2 {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #ec4899, #3b82f6);
            bottom: -200px;
            right: -200px;
            animation-delay: -6s;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 50px) scale(1.2); }
        }

        /* Astra Sky & Starry Particle Splash Animation */
        .starry-sky {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0f172a 0%, #060913 100%);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            overflow: hidden;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }

        .starry-sky.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: starAssemble 2.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
            opacity: 0;
        }

        @keyframes starAssemble {
            0% {
                transform: translate(var(--startX), var(--startY)) scale(0.2);
                opacity: 0;
                box-shadow: 0 0 0px rgba(59, 130, 246, 0);
            }
            60% {
                opacity: 1;
                box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
            }
            100% {
                transform: translate(0, 0) scale(1);
                opacity: 0.9;
                box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
            }
        }

        .splash-content {
            position: relative;
            z-index: 10;
            text-align: center;
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            animation: contentReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
        }

        @keyframes contentReveal {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* Smooth Motion & Scroll Reveal Classes */
        .reveal-on-scroll {
            opacity: 0;
            transform: translateY(24px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .reveal-on-scroll.active {
            opacity: 1;
            transform: translateY(0);
        }

        .fade-in {
            animation: astraFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes astraFadeIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Glassmorphic Cards */
        .glass-card {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s;
        }
        .glass-card:hover {
            transform: translateY(-3px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 30px 60px -12px rgba(59, 130, 246, 0.2);
        }

        /* Form Inputs */
        input, select, textarea {
            background-color: rgba(31, 41, 55, 0.5) !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f3f4f6 !important;
            transition: all 0.25s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25) !important;
            background-color: rgba(31, 41, 55, 0.85) !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #060913; }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Astra Starry Splash Screen (Dynamic Star Generation on Refresh/Load) -->
    <div id="splashScreen" class="starry-sky">
        <div id="starContainer" class="absolute inset-0 pointer-events-none"></div>
        <div class="splash-content px-4">
            <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-500 text-white rounded-3xl flex items-center justify-center text-3xl font-extrabold mx-auto mb-6 shadow-2xl shadow-blue-500/50 border border-white/20">
                ZP
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2">Zuta Paper</h1>
            <p class="text-blue-400 font-medium text-sm mb-4">Specially Made for CMR College</p>
            <div class="inline-block px-4 py-1.5 rounded-full bg-blue-500/10 border border-blue-500/30 text-xs font-semibold uppercase tracking-widest text-blue-300">
                Made by Zubair & Thoufiq
            </div>
            <div class="mt-8">
                <button onclick="dismissSplash()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl shadow-lg shadow-blue-600/30 transition-all">
                    Enter Application →
                </button>
            </div>
        </div>
    </div>

    <!-- Ambient Astra Background Glow -->
    <div class="astra-bg-glow">
        <div class="astra-orb orb-1"></div>
        <div class="astra-orb orb-2"></div>
    </div>

    <!-- App Container -->
    <div id="app" class="flex-grow flex flex-col"></div>

    <!-- Footer Credit -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800/60 bg-[#060913]/90 backdrop-blur-md">
        Zuta Paper • Specially made for CMR College • Made by Zubair & Thoufiq
    </footer>

    <!-- Application Script -->
    <script>
        const STORAGE_KEY = 'zuta_paper_form_data_v5';

        const defaultFormData = {
            recipientName: '',
            recipientDesignation: 'HOD',
            customDesignation: '',
            collegeType: 'cmr',
            institutionName: 'CMRCET',
            addressLines: ['Kandlakoya', 'Medchal'],
            city: 'Hyderabad',
            district: 'Medchal-Malkajgiri',
            state: 'Telangana',
            pincode: '501401',
            studentName: '',
            rollNumber: '',
            courseBranch: 'B.Tech – CSM-F',
            year: '3rd',
            section: '',
            letterDate: new Date().toISOString().split('T')[0],
            absenceType: 'single',
            startDate: new Date().toISOString().split('T')[0],
            endDate: new Date().toISOString().split('T')[0],
            customDatesText: '',
            numberOfDays: 1,
            reasonCategory: 'Personal reasons',
            reasonText: '',
            hasAttendance: 'yes',
            attendancePercentage: '',
            mentorName: '',
            department: '',
            semester: '',
            academicYear: '',
            contactNumber: '',
            email: ''
        };

        let appState = {
            currentScreen: 'home',
            currentStep: 1,
            formData: loadSavedData()
        };

        // Initialize Randomized Astra Stars for Splash Screen
        function initSplashStars() {
            const container = document.getElementById('starContainer');
            if (!container) return;
            container.innerHTML = '';
            const starCount = 55;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                // Random size between 2px and 4.5px
                const size = Math.random() * 2.5 + 2;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;

                // Random target position across screen
                const targetX = Math.random() * window.innerWidth;
                const targetY = Math.random() * window.innerHeight;
                star.style.left = `${targetX}px`;
                star.style.top = `${targetY}px`;

                // Random starting offset distances for assembly effect
                const startX = (Math.random() - 0.5) * window.innerWidth * 1.5;
                const startY = (Math.random() - 0.5) * window.innerHeight * 1.5;
                star.style.setProperty('--startX', `${startX}px`);
                star.style.setProperty('--startY', `${startY}px`);

                // Staggered animation duration & delay
                const delay = Math.random() * 0.4;
                const duration = 1.5 + Math.random() * 0.8;
                star.style.animationDelay = `${delay}s`;
                star.style.animationDuration = `${duration}s`;

                container.appendChild(star);
            }
        }

        function dismissSplash() {
            const splash = document.getElementById('splashScreen');
            if (splash) {
                splash.classList.add('fade-out');
                setTimeout(() => splash.remove(), 800);
            }
        }

        // Auto-dismiss splash after 2.6 seconds if user doesn't click
        window.addEventListener('DOMContentLoaded', () => {
            initSplashStars();
            setTimeout(() => {
                dismissSplash();
            }, 2700);
        });

        function loadSavedData() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                return saved ? { ...defaultFormData, ...JSON.parse(saved) } : { ...defaultFormData };
            } catch (e) {
                return { ...defaultFormData };
            }
        }

        function saveFormData() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.formData));
            } catch (e) {}
        }

        function clearSavedData() {
            try {
                localStorage.removeItem(STORAGE_KEY);
                appState.formData = { ...defaultFormData };
            } catch (e) {}
        }

        function validateStep(step) {
            const d = appState.formData;
            switch(step) {
                case 1:
                    if (d.recipientDesignation === 'Other' && !d.customDesignation.trim()) return "Please enter the custom recipient's designation.";
                    return null;
                case 2:
                    if (d.collegeType === 'other') {
                        if (!d.institutionName.trim()) return "Please enter the college/institution name.";
                        if (!d.addressLines[0].trim()) return "Please enter address line 1.";
                    }
                    return null;
                case 3:
                    if (!d.studentName.trim()) return "Please enter your full name.";
                    if (!d.rollNumber.trim()) return "Please enter your roll number.";
                    if (!d.courseBranch.trim()) return "Please enter your course or branch.";
                    return null;
                case 4:
                    if (!d.letterDate) return "Please select a letter date.";
                    if (!d.numberOfDays || d.numberOfDays <= 0) return "Please enter the number of days absent.";
                    if (!d.reasonText.trim()) return "Please provide a reason for your absence.";
                    return null;
                case 5:
                    if (d.hasAttendance === 'yes') {
                        const att = parseFloat(d.attendancePercentage);
                        if (isNaN(att) || att < 0 || att > 100) return "Please enter a valid attendance percentage between 0 and 100.";
                    }
                    return null;
                default:
                    return null;
            }
        }

        function generateLetterText(d) {
            const formattedDate = new Date(d.letterDate).toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric'
            });

            const designation = d.recipientDesignation === 'Other' ? d.customDesignation : d.recipientDesignation;

            let addressBlock = '';
            if (d.collegeType === 'cmr') {
                addressBlock = `CMRCET\nKandlakoya\nMedchal, Hyderabad - 501401`;
            } else {
                const lines = [d.institutionName, d.addressLines[0], d.addressLines[1], `${d.city}, ${d.state} - ${d.pincode}`].filter(Boolean);
                addressBlock = lines.join('\n');
            }

            let dateDesc = '';
            if (d.absenceType === 'single') {
                dateDesc = `on ${new Date(d.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            } else if (d.absenceType === 'range') {
                dateDesc = `from ${new Date(d.startDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} to ${new Date(d.endDate).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
            } else {
                dateDesc = `on dates: ${d.customDatesText}`;
            }

            let attendanceSentence = '';
            if (d.hasAttendance === 'yes' && d.attendancePercentage !== '') {
                const mentorRef = d.mentorName ? `my mentor ${d.mentorName}` : `my mentor`;
                attendanceSentence = `I have informed ${mentorRef} in prior and my attendance percentage is ${d.attendancePercentage}%.`;
            }

            let letter = `${formattedDate}\n\n`;
            if (d.recipientName.trim()) {
                letter += `${d.recipientName.trim()}\n`;
            }
            if (designation) {
                letter += `${designation}\n`;
            }
            letter += `${addressBlock}\n\n`;
            
            letter += `Respected Sir/Madam,\n\n`;
            letter += `Subject: Request for Leave of Absence\n\n`;
            
            let studentIntro = `I, ${d.studentName}, bearing Roll No. ${d.rollNumber}, from ${d.courseBranch}, ${d.year} year`;
            if (d.section) studentIntro += `, Section ${d.section}`;
            studentIntro += `, was absent ${dateDesc} for ${d.numberOfDays} day(s) due to ${d.reasonText}.`;
            
            letter += `${studentIntro}\n\n`;

            if (attendanceSentence) {
                letter += `${attendanceSentence}\n\n`;
            }

            letter += `I will ensure to follow up on the topics I have missed and will avoid absence in future.\n\n`;
            letter += `Thanking you,\n\n`;
            letter += `Sincerely,\n\n`;
            letter += `Student Name: ${d.studentName}\n`;
            letter += `Roll No: ${d.rollNumber}\n`;
            if (d.courseBranch) letter += `Course/Branch: ${d.courseBranch}\n`;
            if (d.year) letter += `Year: ${d.year} ${d.section ? 'Sec ' + d.section : ''}\n`;
            if (d.contactNumber) letter += `Contact: ${d.contactNumber}\n`;
            if (d.email) letter += `Email: ${d.email}\n`;

            return letter.trim();
        }

        function setupScrollObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal-on-scroll').forEach(el => observer.observe(el));
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            switch(appState.currentScreen) {
                case 'home':
                    app.innerHTML = renderHomeScreen();
                    break;
                case 'form':
                    app.innerHTML = renderFormScreen();
                    attachFormListeners();
                    break;
                case 'review':
                    app.innerHTML = renderReviewScreen();
                    break;
                case 'preview':
                    app.innerHTML = renderPreviewScreen();
                    break;
                case 'about':
                    app.innerHTML = renderAboutScreen();
                    break;
            }
            setupScrollObserver();
        }

        function renderHomeScreen() {
            return `
                <div class="flex-grow flex flex-col items-center justify-center px-4 max-w-xl mx-auto text-center fade-in py-16">
                    <div class="w-20 h-20 bg-blue-500/10 text-blue-400 rounded-3xl flex items-center justify-center text-3xl font-bold mb-6 border border-blue-500/20 shadow-2xl">
                        📄
                    </div>
                    <h1 class="text-4xl font-extrabold tracking-tight text-white mb-2">Zuta Paper</h1>
                    <div class="text-blue-400 font-semibold text-sm mb-4">Specially Made for CMR College</div>
                    <div class="inline-block px-4 py-1.5 rounded-full bg-slate-800/80 border border-slate-700/80 text-xs font-semibold uppercase tracking-widest text-slate-300 mb-6">
                        Made by Zubair & Thoufiq
                    </div>
                    <p class="text-slate-400 mb-8 leading-relaxed text-sm">
                        Create formal college leave applications instantly with smooth Astra animations, tailored specifically for CMR College students.
                    </p>
                    <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
                        <button onclick="startNewFlow()" class="px-8 py-4 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-2xl shadow-lg shadow-blue-600/30 transition-all duration-300 text-sm transform hover:-translate-y-0.5">
                            Create New Letter
                        </button>
                        <button onclick="navigateTo('about')" class="px-8 py-4 glass-card hover:bg-slate-800 text-slate-300 font-semibold rounded-2xl transition-all duration-300 text-sm">
                            About Zuta Paper
                        </button>
                    </div>
                </div>
            `;
        }

        function renderFormScreen() {
            const step = appState.currentStep;
            const totalSteps = 6;
            const progress = (step / totalSteps) * 100;
            const d = appState.formData;

            let stepTitle = "";
            let stepSubtitle = "";

            switch(step) {
                case 1: stepTitle = "Recipient Details"; stepSubtitle = "Who are you sending the letter to?"; break;
                case 2: stepTitle = "College & Address"; stepSubtitle = "CMR College or Custom Institution"; break;
                case 3: stepTitle = "Student Details"; stepSubtitle = "Your academic identification"; break;
                case 4: stepTitle = "Absence & Reason"; stepSubtitle = "Dates and cause of absence"; break;
                case 5: stepTitle = "Attendance Percentage"; stepSubtitle = "Optional attendance disclosure"; break;
                case 6: stepTitle = "Additional Details"; stepSubtitle = "Optional metadata (mentor, dept, etc.)"; break;
            }

            return `
                <div class="flex-grow flex flex-col max-w-2xl w-full mx-auto px-4 py-8 fade-in">
                    <div class="mb-8 reveal-on-scroll">
                        <div class="flex items-center justify-between mb-4">
                            <button onclick="navigateHomeWithConfirm()" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center gap-1 transition-colors">
                                ← Exit to Home
                            </button>
                            <span class="text-xs font-bold uppercase tracking-wider text-blue-400 bg-blue-500/10 px-3 py-1 rounded-full border border-blue-500/20">
                                Step ${step} of ${totalSteps}
                            </span>
                        </div>
                        <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                            <div class="bg-blue-500 h-full transition-all duration-700 ease-out shadow-sm shadow-blue-500/50" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <div class="mb-6 reveal-on-scroll">
                        <h2 class="text-2xl font-bold text-white">${stepTitle}</h2>
                        <p class="text-slate-400 text-xs mt-1">${stepSubtitle}</p>
                    </div>

                    <div id="form-error" class="hidden mb-4 p-4 bg-red-500/10 border border-red-500/30 text-red-400 text-xs rounded-xl font-medium fade-in"></div>

                    <div class="glass-card rounded-3xl p-6 sm:p-8 mb-6 flex-grow reveal-on-scroll">
                        ${renderStepFields(step, d)}
                    </div>

                    <div class="flex items-center justify-between gap-4 pt-2 reveal-on-scroll">
                        ${step > 1 ? `
                            <button onclick="prevStep()" class="px-6 py-3 glass-card hover:bg-slate-800 text-slate-300 font-semibold rounded-xl text-xs transition-all">
                                Back
                            </button>
                        ` : `<div></div>`}
                        
                        ${step < totalSteps ? `
                            <button onclick="nextStep()" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl shadow-lg shadow-blue-600/20 transition-all text-xs ml-auto">
                                Continue
                            </button>
                        ` : `
                            <button onclick="finishForm()" class="px-8 py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/20 transition-all text-xs ml-auto">
                                Review Letter →
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function renderStepFields(step, d) {
            switch(step) {
                case 1:
                    return `
                        <div class="space-y-5 fade-in">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-1">Recipient Full Name <span class="text-slate-500 font-normal">(Optional)</span></label>
                                <input type="text" id="recipientName" value="${escapeHTML(d.recipientName)}" placeholder="e.g. Dr. Ramesh Kumar" class="w-full px-4 py-3 rounded-xl border text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-2">Recipient Designation *</label>
                                <select id="recipientDesignation" onchange="updateFormData({recipientDesignation: this.value})" class="w-full px-4 py-3 rounded-xl border text-sm">
                                    ${['Principal', 'HOD', 'Class Coordinator', 'Faculty/Lecturer', 'Mentor', 'Other'].map(opt => `
                                        <option value="${opt}" ${d.recipientDesignation === opt ? 'selected' : ''} style="background: #111827; color: #f3f4f6;">${opt}</option>
                                    `).join('')}
                                </select>
                            </div>
                            <div id="customDesignationContainer" class="${d.recipientDesignation === 'Other' ? '' : 'hidden'}">
                                <label class="block text-xs font-semibold text-slate-300 mb-2">Custom Designation *</label>
                                <input type="text" id="customDesignation" value="${escapeHTML(d.customDesignation)}" placeholder="e.g. Dean of Academics" class="w-full px-4 py-3 rounded-xl border text-sm">
                            </div>
                        </div>
                    `;
                case 2:
                    return `
                        <div class="space-y-5 fade-in">
                            <div>
                                <label class="block text-xs font-semibold text-slate-300 mb-3">College Preset</label>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <label class="flex items-center gap-3 p-4 rounded-xl cursor-pointer transition-all border ${d.collegeType === 'cmr' ? 'border-blue-500 bg-blue-500/10' : 'border-slate-800 bg-slate-900/40 hover:border-slate-700'}">
                                        <input type="radio" name="collegeType" value="cmr" ${d.collegeType === 'cmr' ? 'checked' : ''} onchange="setCollegeType('cmr')" class="text-blue-500">
                                        <div>
                                            <div class="font-semibold text-white text-sm">CMR College</div>
                                            <div class="text-[11px] text-slate-400">CMRCET, Kandlakoya (Default)</div>
                                        </div>
                                    </label>
                                    <label class="flex items-center gap-3 p-4 rounded-xl cursor-pointer transition-all border ${d.collegeType === 'other' ? 'border-blue-500 bg-blue-500/10' : 'border-slate-800 bg-slate-900/40 hover:border-slate-700'}">
                                        <input type="radio" name="collegeType" value="other" ${d.collegeType === 'other' ? 'checked' : ''} onchange="setCollegeType('other')" class="text-blue-500">
                                        <div>
                                            <div class="font-semibold text-white text-sm">Other College</div>
                                            <div class="text-[11px] text-slate-400">Custom Institution</div>

            if (document.getElementById('city')) d.city = document.getElementById('city').value;
            if (document.getElementById('district')) d.district = document.getElementById('district').value;
            if (document.getElementById('state')) d.state = document.getElementById('state').value;
            if (document.getElementById('pincode')) d.pincode = document.getElementById('pincode').value;

            if (document.getElementById('studentName')) d.studentName = document.getElementById('studentName').value;
            if (document.getElementById('rollNumber')) d.rollNumber = document.getElementById('rollNumber').value;
            if (document.getElementById('courseBranch')) d.courseBranch = document.getElementById('courseBranch').value;
            if (document.getElementById('year')) d.year = document.getElementById('year').value;
            if (document.getElementById('section')) d.section = document.getElementById('section').value;

            if (document.getElementById('letterDate')) d.letterDate = document.getElementById('letterDate').value;
            if (document.getElementById('numberOfDays')) d.numberOfDays = parseInt(document.getElementById('numberOfDays').value) || 1;
            if (document.getElementById('startDate')) d.startDate = document.getElementById('startDate').value;
            if (document.getElementById('endDate')) d.endDate = document.getElementById('endDate').value;
            if (document.getElementById('customDatesText')) d.customDatesText = document.getElementById('customDatesText').value;
            if (document.getElementById('reasonText')) d.reasonText = document.getElementById('reasonText').value;

            if (document.getElementById('attendancePercentage')) d.attendancePercentage = document.getElementById('attendancePercentage').value;

            if (document.getElementById('mentorName')) d.mentorName = document.getElementById('mentorName').value;
            if (document.getElementById('department')) d.department = document.getElementById('department').value;
            if (document.getElementById('semester')) d.semester = document.getElementById('semester').value;
            if (document.getElementById('academicYear')) d.academicYear = document.getElementById('academicYear').value;
            if (document.getElementById('contactNumber')) d.contactNumber = document.getElementById('contactNumber').value;
            if (document.getElementById('email')) d.email = document.getElementById('email').value;

            saveFormData();
        }

        function nextStep() {
            syncFormInputsToState();
            const error = validateStep(appState.currentStep);
            const errDiv = document.getElementById('form-error');
            if (error) {
                errDiv.textContent = error;
                errDiv.classList.remove('hidden');
                return;
            }
            errDiv.classList.add('hidden');
            if (appState.currentStep < 6) {
                appState.currentStep++;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevStep() {
            syncFormInputsToState();
            if (appState.currentStep > 1) {
                appState.currentStep--;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function finishForm() {
            syncFormInputsToState();
            const error = validateStep(appState.currentStep);
            const errDiv = document.getElementById('form-error');
            if (error) {
                errDiv.textContent = error;
                errDiv.classList.remove('hidden');
                return;
            }
            appState.currentScreen = 'review';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function generateFinalLetter() {
            appState.currentScreen = 'preview';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function editDetails() {
            appState.currentScreen = 'form';
            appState.currentStep = 1;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function confirmStartNew() {
            if (confirm("Are you sure you want to clear the current letter and start over?")) {
                clearSavedData();
                appState.currentScreen = 'home';
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function copyLetter() {
            const letterText = generateLetterText(appState.formData);
            navigator.clipboard.writeText(letterText).then(() => {
                showToast("Letter copied successfully.");
            }).catch(() => {
                showToast("Failed to copy letter.");
            });
        }

        function downloadPDF() {
            const element = document.getElementById('pdfContent');
            const opt = {
                margin:       10,
                filename:     `Zuta_Paper_CMR_Leave_Letter_${appState.formData.rollNumber || 'Student'}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(opt).save();
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (toast) {
                toast.textContent = msg;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 3000);
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function attachFormListeners() {
            const inputs = ['institutionName', 'addressLine1', 'addressLine2', 'city', 'district', 'state', 'pincode'];
            inputs.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', () => {
                        syncFormInputsToState();
                        const d = appState.formData;
                        const previewEl = document.getElementById('liveAddressPreview');
                        if (previewEl) {
                            previewEl.textContent = [d.institutionName, d.addressLines[0], d.addressLines[1], `${d.city}, ${d.state} - ${d.pincode}`].filter(Boolean).join('\n');
                        }
                    });
                }
            });
        }

        render();
    </script>
</body>
</html>
